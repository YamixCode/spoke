name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Версия в коде совпадает с тегом
        run: test "v$(python scripts/build_code_zip.py --version)" = "$GITHUB_REF_NAME"
      - name: Собрать архив с кодом
        run: python scripts/build_code_zip.py dist --require-native
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/spoke-code-*.zip dist/spoke-code-*.zip.sha256 --title "Spoke ${GITHUB_REF_NAME#v}" --generate-notes
