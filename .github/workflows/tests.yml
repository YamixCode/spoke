name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest certifi
      - run: python -m pytest -q

  native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build_native.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices pyobjc-framework-Quartz
      - run: python -m pytest -q tests/test_macos_text_field.py
